<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta · {marca}</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../../../../../design-system/tokens.css" />
  <link rel="stylesheet" href="mockups.css" />
  <script src="../../../../../../design-system/brand.js"></script>
</head>
<body>
  <div class="app">
  <header class="cabecera">
    <a class="marca" href="c-inicio-sin-sesion.html"><img src="../../../../../../design-system/assets/logo.svg?v=5" alt="Turnos odontología" /></a>
    <div class="acciones-cabecera"><a class="enlace-sobre-azul" href="c-reserva-paso1.html">Reservar turno</a><a class="btn-sobre-azul" href="c-mi-cuenta.html">Ingresar</a></div>
  </header>
  <div class="cuerpo">
    
    
    <main class="contenido-app">
      <div class="pagina">
    <h1>Mi cuenta</h1>
    <section class="panel">
      <div class="pestanas" role="tablist" aria-label="Cuenta">
        <button type="button" role="tab" aria-selected="true">Ingresar</button>
        <button type="button" role="tab" aria-selected="false">Crear cuenta</button>
      </div>
      <form class="formulario" onsubmit="return false" novalidate>
        <div class="campo">
          <label for="email">Email</label>
          <input class="control" id="email" type="text" autocomplete="username" />
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input class="control" id="clave" type="password" autocomplete="current-password" />
        </div>
        <button class="btn btn-principal btn-ancho" type="submit">Ingresar</button>
      </form>
      <p class="nota-personal">¿Sos del personal del consultorio? Ingresá con tu usuario en este mismo formulario.</p>
    </section>
  </div>

    </main>
  </div>
  <footer class="pie"><span data-brand-name>Turnos odontología</span></footer>
  </div>

</body>
</html>
