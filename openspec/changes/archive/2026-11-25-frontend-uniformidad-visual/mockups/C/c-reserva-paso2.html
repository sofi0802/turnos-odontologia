<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar turno · Paso 2 · {marca}</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../../../../../design-system/tokens.css" />
  <link rel="stylesheet" href="mockups.css" />
  <script src="../../../../../../design-system/brand.js"></script>
</head>
<body>
  <div class="app">
  <header class="cabecera">
    <a class="marca" href="c-inicio-sin-sesion.html"><img src="../../../../../../design-system/assets/logo.svg?v=5" alt="Turnos odontología" /></a>
    <div class="acciones-cabecera"><a class="enlace-sobre-azul" href="c-reserva-paso1.html">Reservar turno</a><a class="btn-sobre-azul" href="c-mi-cuenta.html">Ingresar</a></div>
  </header>
  <div class="cuerpo">
    
    
    <main class="contenido-app">
      <div class="pagina">
    <h1>Reservar turno</h1>
    <section class="panel" aria-labelledby="t-paso">
      <ol class="pasos" aria-hidden="true"><li class="hecho"></li><li class="hecho"></li><li></li></ol>
      <p class="paso-numero">Paso 2 de 3</p>
      <h2 id="t-paso">Elegí día y horario</h2>
      <p class="subtitulo">Consulta o control · 30 minutos</p>

      <fieldset class="opciones" style="border:0;padding:0;margin:var(--ds-espacio-3) 0 0">
        <legend class="seccion-titulo" style="margin-top:0">Profesional</legend>
        <label class="opcion"><input type="radio" name="pro" checked /> <span>Sin preferencia<small>Te asignamos quien esté libre</small></span></label>
        <label class="opcion"><input type="radio" name="pro" /> <span>Ana Ejemplo</span></label>
        <label class="opcion"><input type="radio" name="pro" /> <span>Bruno Prueba</span></label>
      </fieldset>

      <div class="campo" style="margin-top:var(--ds-espacio-3)">
        <label for="fecha">Día</label>
        <input class="control" id="fecha" type="date" value="2026-12-01" min="2026-12-01" />
        <p class="ayuda">Martes 1 de diciembre</p>
      </div>

      <p class="seccion-titulo" id="t-horarios">Horarios libres</p>
      <div class="chips" role="group" aria-labelledby="t-horarios">
        <button class="chip" type="button" aria-pressed="false">10:00</button>
        <button class="chip" type="button" aria-pressed="true">10:30</button>
        <button class="chip" type="button" aria-pressed="false">11:00</button>
        <button class="chip" type="button" aria-pressed="false">11:30</button>
        <button class="chip" type="button" aria-pressed="false">12:00</button>
        <button class="chip" type="button" aria-pressed="false">12:30</button>
        <button class="chip" type="button" aria-pressed="false">14:00</button>
        <button class="chip" type="button" aria-pressed="false">15:30</button>
      </div>

      <div class="acciones">
        <a class="btn" href="c-reserva-paso1.html">Volver</a>
        <a class="btn btn-principal" href="c-reserva-paso3.html">Continuar</a>
      </div>
    </section>
  </div>

    </main>
  </div>
  <footer class="pie"><span data-brand-name>Turnos odontología</span></footer>
  </div>

</body>
</html>
