<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Margen · Configuración · {marca}</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../../../design-system/tokens.css" />
  <link rel="stylesheet" href="mockups.css" />
  <script src="../../../../design-system/brand.js"></script>
</head>
<body>
  <header class="app-encabezado">
    <a class="marca" href="#"><img src="../../../../design-system/assets/logo.svg" alt="Logo provisorio" /><span data-brand-name>Turnos odontología</span></a>
    <nav class="nav" aria-label="Principal">
      <a href="#">Agenda</a>
      <a href="profesionales.html" aria-current="page">Configuración</a>
    </nav>
    <div class="usuario">
      <span class="avatar" aria-hidden="true">AD</span>
      <span class="usuario-nombre">admin</span>
      <button class="btn btn-fantasma btn-chico" type="button">Salir</button>
    </div>
  </header>

  <main class="pagina pagina-config">
    <h1>Configuración</h1>
    <div class="pestanas-config" role="tablist" aria-label="Secciones de configuración">
      <button class="pestana" role="tab" type="button" aria-selected="false" tabindex="-1">Profesionales</button>
      <button class="pestana" role="tab" type="button" aria-selected="false" tabindex="-1">Sillones</button>
      <button class="pestana" role="tab" type="button" aria-selected="false" tabindex="-1">Prestaciones</button>
      <button class="pestana" role="tab" type="button" aria-selected="true">Margen</button>
      <button class="pestana" role="tab" type="button" aria-selected="false" tabindex="-1">Horarios</button>
      <button class="pestana" role="tab" type="button" aria-selected="false" tabindex="-1">Ausencias</button>
      <button class="pestana" role="tab" type="button" aria-selected="false" tabindex="-1">Bloqueos</button>
    </div>
    <section role="tabpanel" aria-label="Margen">
      <div class="cabecera-seccion"><h2>Margen entre turnos</h2></div>
      <div class="panel">
        <p class="ayuda">Tiempo mínimo entre dos turnos del mismo profesional o del mismo sillón.</p>
        <p style="margin-top:var(--ds-espacio-1)">Margen vigente: <span class="margen-valor">10</span> minutos</p>
        <form class="campo-margen" style="margin-top:var(--ds-espacio-2)">
          <div class="campo"><label for="mg">Nuevo margen</label><input class="control" id="mg" type="number" min="10" step="5" value="5" aria-invalid="true" /></div>
          <button class="btn btn-principal" type="button">Guardar margen</button>
        </form>
        <p class="error-campo" style="margin-top:var(--ds-espacio-1)">El margen tiene que ser de 10 minutos o más.</p>
      </div>
    </section>
  </main>
  <script>document.querySelector('.pestana[aria-selected="true"]').scrollIntoView({ block: 'nearest', inline: 'center' });</script>
</body>
</html>
