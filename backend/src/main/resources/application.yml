spring:
  profiles:
    default: dev
  servlet:
    # C-26: imágenes clínicas de hasta 10 MB (RN-CL-07). El pedido deja margen para las partes de texto (design D5).
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  # Fix de C-05: ni la traza ni el mensaje de una excepción salen en el cuerpo de un error, ni por el BasicErrorController
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
# C-18 (RN-OS-07): Hibernate vuelca en el log el detalle de PostgreSQL ante una violación de restricción, que incluye
# los valores de la fila (por ejemplo el número de afiliado de una EXCLUDE). Los errores de negocio ya se traducen en
# la API, así que se apaga ese registro para que ningún dato de cobertura (ni de otro módulo) llegue a los logs.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
app:
  seguridad:
    cors-origenes: ${APP_CORS_ORIGENES:http://localhost:5173}
    admin-inicial:
      username: ${APP_ADMIN_USERNAME:}
      password: ${APP_ADMIN_PASSWORD:}
  notificaciones:
    # Apaga la tarea de recordatorios (los tests de integración la apagan y llaman al caso de uso a mano)
    activo: ${NOTIFICACIONES_ACTIVO:true}
    # Origen de los links del mensaje: el frontend, que hace el POST de confirmación (no el GET)
    base-url: ${NOTIFICACIONES_BASE_URL:http://localhost:5173}
    # Pantallas del paciente a las que apuntan los links de cancelar y reprogramar (las define el frontend, C-12)
    ruta-cancelar: ${NOTIFICACIONES_RUTA_CANCELAR:/mis-turnos/cancelar}
    ruta-reprogramar: ${NOTIFICACIONES_RUTA_REPROGRAMAR:/mis-turnos/reprogramar}
    intervalo-ms: ${NOTIFICACIONES_INTERVALO_MS:300000}
  agenda:
    asistencia:
      # C-43: tarea que pasa a ATENDIDO los turnos con llegada cuyo margen terminó (el perfil de test la apaga)
      activo: ${AGENDA_ASISTENCIA_ACTIVO:true}
      intervalo-ms: ${AGENDA_ASISTENCIA_INTERVALO_MS:300000}
  consultorio:
    nombre: ${CONSULTORIO_NOMBRE:Consultorio odontológico}
    direccion: ${CONSULTORIO_DIRECCION:Dirección a confirmar}
  clinica:
    imagenes:
      # C-26: carpeta del almacén de imágenes clínicas (DD-17). Datos de salud: permisos solo para el proceso e
      # incluirla en los respaldos. El valor por defecto queda en backend/data/, ignorado por git.
      directorio: ${IMAGENES_DIRECTORIO:./data/imagenes}
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # C-04: el seed ficticio (db/seed) se carga solo en desarrollo.
    locations: classpath:db/migration,classpath:db/seed
    # Los números de migración están reservados por change (CHANGES.md) y los PR se mergean en
    # otro orden: una base de desarrollo con V3 aplicada tiene que poder aplicar después V2.
    out-of-order: true
---
# C-04: perfil de los tests de integración. Usa una base aparte (recomendado turnos_test)
# porque los tests vacían las tablas, y no carga el seed de desarrollo.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_TEST_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    # Cada contexto de test que Spring guarda en caché retiene su pool. Con el pool de 10 por defecto, los
    # contextos de C-06 a C-11 superan las 100 conexiones de PostgreSQL. Los tests usan como máximo 2 hilos.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
# C-43: los tests llaman al paso a atendidos a mano, con el reloj de cada escenario.
app:
  agenda:
    asistencia:
      activo: false
  clinica:
    imagenes:
      # C-26: los tests guardan los archivos en una carpeta temporal, nunca en la del desarrollo.
      directorio: ${java.io.tmpdir}/turnos-odontologia-imagenes-test
